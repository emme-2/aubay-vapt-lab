<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VA/PT Lab — Rischio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Brand Aubay */
    --brand:#E04000; --brand2:#EC7E5A; --brand-red:#E02B20; --teal:#22AFBA;
    /* Superficie chiara */
    --bg:#f4f5f7; --panel:#ffffff; --panel2:#eef0f3; --line:#e2e5ea;
    --ink:#2c2c2c; --ink2:#444444; --muted:#7c8694;
    /* Scala severità (legenda, distinta dal brand) */
    --critical:#b3122a; --high:#e8602c; --medium:#d79a12; --low:#2f74c0; --info:#8a94a3;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Poppins,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       background:var(--bg);color:var(--ink);line-height:1.5}
  header{background:linear-gradient(120deg,var(--brand) 0%,var(--brand2) 100%);
         color:#fff;padding:20px 32px;display:flex;align-items:center;gap:18px;
         box-shadow:0 2px 14px rgba(224,64,0,.18)}
  header img{height:52px;width:52px;border-radius:50%;background:#fff;flex:none}
  header .t h1{font-size:20px;margin:0;font-weight:600;letter-spacing:-.2px}
  header .t .sub{font-size:13px;opacity:.92;font-weight:400}
  header .badge{margin-left:auto;font-size:11px;font-weight:600;letter-spacing:.8px;
                text-transform:uppercase;background:rgba(255,255,255,.18);
                padding:6px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.3)}
  .wrap{padding:22px 32px 48px;max-width:1120px}
  .toggle{display:inline-flex;background:var(--panel);border:1px solid var(--line);
          border-radius:10px;padding:4px;gap:4px;margin:4px 0 24px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .toggle button{all:unset;cursor:pointer;padding:9px 20px;border-radius:7px;font-size:14px;
                 font-weight:600;color:var(--muted)}
  .toggle button[aria-selected=true]{background:var(--brand);color:#fff}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:26px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;
       box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .kpi .n{font-size:30px;font-weight:700;line-height:1}
  .kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-top:8px;font-weight:600}
  .kpi.tot{border-top:3px solid var(--brand)}
  .kpi.tot .n{color:var(--ink)}
  .kpi.c .n{color:var(--critical)} .kpi.h .n{color:var(--high)}
  .kpi.m .n{color:var(--medium)} .kpi.l_ .n{color:var(--low)} .kpi.i .n{color:var(--info)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px;
         margin-bottom:22px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .panel h2{font-size:14px;margin:0 0 16px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--ink2)}
  .bar{display:flex;align-items:center;gap:12px;margin:9px 0}
  .bar .cap{width:90px;font-size:13px;color:var(--ink2);text-transform:capitalize;font-weight:500}
  .bar .track{flex:1;background:var(--panel2);border-radius:6px;height:22px;overflow:hidden}
  .bar .fill{height:100%;border-radius:6px;min-width:2px;transition:width .4s}
  .bar .v{width:34px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:2px solid var(--line)}
  td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  .sev{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;
       text-transform:uppercase;color:#fff}
  .delta{font-size:13px;color:var(--muted);margin-top:6px}
  .down{color:#1a9e68;font-weight:600} .up{color:var(--critical);font-weight:600}
  .empty{color:var(--muted);padding:22px 0;text-align:center}
  footer{color:var(--muted);font-size:12px;padding:0 32px 30px}
  footer b{color:var(--brand);font-weight:600}
  a{color:var(--teal)}
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="Aubay">
  <div class="t">
    <h1>Vulnerability Assessment — fotografia del rischio</h1>
    <div class="sub">Azienda-cliente simulata · scansione automatizzata degli asset esposti</div>
  </div>
  <div class="badge">Aubay · Cyber Security</div>
</header>
<div class="wrap">
  <div class="toggle" role="tablist">
    <button role="tab" data-phase="before" aria-selected="true">Prima</button>
    <button role="tab" data-phase="after"  aria-selected="false">Dopo remediation</button>
  </div>

  <div class="grid" id="kpis"></div>

  <div class="panel">
    <h2>Distribuzione per severità</h2>
    <div id="bars"></div>
    <div class="delta" id="delta"></div>
  </div>

  <div class="panel">
    <h2>Dettaglio rilevazioni</h2>
    <div id="table"></div>
  </div>
</div>
<footer id="foot">In attesa della prima scansione…</footer>

<script>
const SEV = [["critical","critical"],["high","high"],["medium","medium"],["low","low"],["info","info"]];
const COL = {critical:"var(--critical)",high:"var(--high)",medium:"var(--medium)",low:"var(--low)",info:"var(--info)"};
let DATA = {runs:{}}, phase = "before";

function total(c){return SEV.reduce((s,[k])=>s+(c?.[k]||0),0)}
function weight(c){return (c?.critical||0)*5+(c?.high||0)*3+(c?.medium||0)*1.5+(c?.low||0)*0.5}

function render(){
  const run = DATA.runs?.[phase];
  const other = DATA.runs?.[phase==="before"?"after":"before"];
  const kpis = document.getElementById("kpis");
  const bars = document.getElementById("bars");
  const table = document.getElementById("table");
  const delta = document.getElementById("delta");

  if(!run){ kpis.innerHTML=""; bars.innerHTML=""; delta.textContent="";
    table.innerHTML='<div class="empty">Nessun dato per questa fase. Lancia <code>make scan PHASE='+phase+'</code>.</div>';
    return; }

  const c = run.counts||{};
  kpis.innerHTML =
    `<div class="kpi tot"><div class="n">${total(c)}</div><div class="l">Totale</div></div>`+
    `<div class="kpi c"><div class="n">${c.critical||0}</div><div class="l">Critical</div></div>`+
    `<div class="kpi h"><div class="n">${c.high||0}</div><div class="l">High</div></div>`+
    `<div class="kpi m"><div class="n">${c.medium||0}</div><div class="l">Medium</div></div>`+
    `<div class="kpi l_"><div class="n">${c.low||0}</div><div class="l">Low</div></div>`+
    `<div class="kpi i"><div class="n">${c.info||0}</div><div class="l">Info</div></div>`;

  const max = Math.max(1, ...SEV.map(([k])=>c[k]||0));
  bars.innerHTML = SEV.map(([k,lbl])=>{
    const v=c[k]||0;
    return `<div class="bar"><div class="cap">${lbl}</div>
      <div class="track"><div class="fill" style="width:${v/max*100}%;background:${COL[k]}"></div></div>
      <div class="v">${v}</div></div>`;
  }).join("");

  if(other){
    const d = weight(c)-weight(other.counts||{});
    if(phase==="after" && d<0) delta.innerHTML=`<span class="down">▼ Indice di rischio ridotto del ${Math.round(-d/Math.max(1,weight(other.counts))*100)}% dopo la remediation.</span>`;
    else if(phase==="before" && weight(other.counts||{})<weight(c)) delta.innerHTML=`Confronta con la fase "Dopo" per vedere l'effetto della remediation.`;
    else delta.textContent="";
  } else delta.textContent="";

  const f = run.findings||[];
  if(!f.length){ table.innerHTML='<div class="empty">Scansione senza rilevazioni.</div>'; }
  else{
    const order={critical:0,high:1,medium:2,low:3,info:4};
    f.sort((a,b)=>(order[a.severity]??9)-(order[b.severity]??9));
    table.innerHTML='<table><thead><tr><th>Severità</th><th>Rilevazione</th><th>Asset</th></tr></thead><tbody>'+
      f.map(x=>`<tr><td><span class="sev" style="background:${COL[x.severity]||'#888'}">${x.severity||'?'}</span></td>
        <td>${esc(x.name)}</td><td style="color:var(--muted)">${esc(x.host||'')}</td></tr>`).join("")+
      '</tbody></table>';
  }
  document.getElementById("foot").innerHTML =
    "Ultima scansione: "+(DATA.generated?new Date(DATA.generated).toLocaleString('it-IT'):"—")+
    " · strumento: <b>Nuclei</b> (open source) · Aubay Cyber Security";
}
function esc(s){return (s||"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]))}

document.querySelectorAll('.toggle button').forEach(b=>b.onclick=()=>{
  phase=b.dataset.phase;
  document.querySelectorAll('.toggle button').forEach(x=>x.setAttribute('aria-selected', x===b));
  render();
});

async function load(){
  try{ const r=await fetch('results.json?t='+Date.now()); if(r.ok) DATA=await r.json(); }catch(e){}
  render();
}
load();
setInterval(load, 5000);
</script>
</body>
</html>
