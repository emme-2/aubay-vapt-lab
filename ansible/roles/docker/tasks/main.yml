# =====================================================================
#  Ruolo: docker — Docker Engine + plugin Compose
#  Usa lo script ufficiale get.docker.com: gestisce bene le release
#  recenti di Ubuntu (incluso il codename di 26.04).
# =====================================================================
- name: Verifica se Docker è già installato
  ansible.builtin.command: docker --version
  register: docker_check
  failed_when: false
  changed_when: false

- name: Installa Docker Engine (script ufficiale)
  ansible.builtin.shell: curl -fsSL https://get.docker.com | sh
  args:
    creates: /usr/bin/docker
  when: docker_check.rc != 0

- name: Abilita e avvia il servizio Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Verifica il plugin Compose v2
  ansible.builtin.command: docker compose version
  register: compose_check
  failed_when: compose_check.rc != 0
  changed_when: false
