# Reverse proxy "bastione" davanti a DVWA — con debolezze tipiche da analizzare.
server {
    listen 80;
    server_name proxy.corp.local;

    # Information disclosure: versione del server esposta
    server_tokens on;

    # Nessun security header (HSTS, X-Frame-Options, CSP assenti) → finding VA

    location / {
        proxy_pass http://web.corp.local:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Misconfig: directory listing esposto
    location /files {
        alias /usr/share/nginx/html/;
        autoindex on;
    }
}
