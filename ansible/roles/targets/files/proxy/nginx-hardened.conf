# Reverse proxy "bastione" davanti a DVWA — VERSIONE HARDENED (remediation).
# Durante la demo si sostituisce a nginx.conf per mostrare il "dopo".
server {
    listen 80;
    server_name proxy.corp.local;

    # Remediation: versione del server nascosta
    server_tokens off;

    # Remediation: security header applicati
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://web.corp.local:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Remediation: directory listing rimosso (niente autoindex)
}
