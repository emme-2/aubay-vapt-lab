# Dovecot — IMAP didattico per il lab (in chiaro, Maildir).
protocols = imap
listen = *

# Lab: autenticazione in chiaro consentita (debolezza voluta, nessun TLS)
disable_plaintext_auth = no
auth_mechanisms = plain login
ssl = no

mail_location = maildir:~/Maildir

userdb {
  driver = passwd
}
passdb {
  driver = pam
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 0
  }
}

log_path = /dev/stderr
