# =====================================================================
#  Ruolo: common — pacchetti base, timezone, hardening leggero
# =====================================================================
- name: Aggiorna la cache apt
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Installa pacchetti di base
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - gnupg
      - git
      - vim
      - tmux
      - htop
      - jq
      - openssl
      - python3-pip
    state: present

- name: Imposta il timezone su Europe/Rome
  ansible.builtin.command: timedatectl set-timezone Europe/Rome
  changed_when: false

- name: SSH solo a chiave (disabilita password)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
    state: present
  notify: Restart ssh
